# Paste these values into Streamlit Community Cloud -> App settings -> Secrets.
# Never commit the real private key.

NF_SSH_HOST = "your-server.example.com-or-ip"
NF_SSH_PORT = 22
NF_SSH_USERNAME = "restricted-forwarding-user"
NF_SSH_HOST_KEY_SHA256 = "SHA256:replace-with-server-host-key-fingerprint"
NF_REMOTE_API_HOST = "127.0.0.1"
NF_REMOTE_API_PORT = 8000
NF_SSH_PRIVATE_KEY = """
-----BEGIN OPENSSH PRIVATE KEY-----
replace-with-dedicated-restricted-key
-----END OPENSSH PRIVATE KEY-----
"""

# Alternative: if FastAPI is exposed through a trusted HTTPS reverse proxy or
# Cloudflare Tunnel, set NF_BACKEND_URL and omit every NF_SSH_* value above.
# NF_BACKEND_URL = "https://api.example.com"
# NF_API_ACCESS_TOKEN = "optional-bearer-token"
# CF_ACCESS_CLIENT_ID = "optional-cloudflare-access-service-token-id"
# CF_ACCESS_CLIENT_SECRET = "optional-cloudflare-access-service-token-secret"
